name: Build and release

on:
  push:
    tags:
      - "v*"          # git tag v1.0.0 && git push --tags  ->  builds + publishes a release
  workflow_dispatch:   # manual run from the Actions tab
    inputs:
      version:
        description: "Release version, e.g. v1.2.0 (only used when 'Publish a release' is ticked)"
        required: false
        type: string
      release:
        description: "Publish a release (leave unticked to just build the exes as artifacts)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write      # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ScheduleOptimizer-Classic
            script: src/schedule_optimizer_gui.py
            extra_args: ""
          - name: ScheduleOptimizer-Modern
            script: src/schedule_optimizer_ctk.py
            extra_args: "--collect-all customtkinter"   # bundles customtkinter's themes/assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: bash
        run: |
          pyinstaller --onefile --windowed --clean \
            --name "${{ matrix.name }}" \
            ${{ matrix.extra_args }} \
            "${{ matrix.script }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - name: Work out the tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
            [ -n "$TAG" ] || { echo "Enter a version (e.g. v1.2.0) to publish a release."; exit 1; }
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}   # creates the tag on this commit if it doesn't exist yet
          files: dist/*.exe
          generate_release_notes: true